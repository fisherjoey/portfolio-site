<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="chordapp-mobile-arch-title chordapp-mobile-arch-desc">
<title id="chordapp-mobile-arch-title">ChordApp Mobile architecture</title>
<desc id="chordapp-mobile-arch-desc">An Expo app shares the web app's Supabase backend and scraper proxy, caching songs on the phone.</desc>
