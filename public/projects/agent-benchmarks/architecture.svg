<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="agent-benchmarks-arch-title agent-benchmarks-arch-desc">
<title id="agent-benchmarks-arch-title">Coding-agent benchmark tasks architecture</title>
<desc id="agent-benchmarks-arch-desc">Repositories are screened for real missing features; hidden tests and a reference solution are built into an offline Docker sandbox; cold AI solvers and a fairness grader calibrate difficulty before submission.</desc>
