<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="agent-pipeline-arch-title agent-pipeline-arch-desc">
<title id="agent-pipeline-arch-title">Autonomous agent dev pipeline architecture</title>
<desc id="agent-pipeline-arch-desc">Linear tickets reach coding agents through a webhook cache; agents implement in isolated worktrees, pass automated code review, then a risk gate, CI and merge, with defects tracked in an escape ledger.</desc>
<defs><marker id="agent-pipeline-arch-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B6B73"/></marker></defs>
<text x="40" y="78" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40">Ticket to merge, behind a risk gate</text>
<line x1="386" y1="402" x2="424" y2="402" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#agent-pipeline-arch-arr)"/>
<line x1="776" y1="402" x2="814" y2="402" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#agent-pipeline-arch-arr)"/>
<rect x="40" y="128" width="340" height="512" rx="10" fill="rgba(26,26,26,0.035)"/>
<text x="56" y="158" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="17" letter-spacing="2">INTAKE</text>
