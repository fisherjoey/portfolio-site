<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <filter id="raShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1A1A1A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="raImg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9EEF5"/><stop offset="1" stop-color="#DCE4EF"/></linearGradient>
    <linearGradient id="raImg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1EDE6"/><stop offset="1" stop-color="#E7E0D3"/></linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#FAF8F4"/>

  <!-- browser window -->
  <rect x="120" y="96" width="1360" height="812" rx="16" fill="#FFFFFF" stroke="#E2DBCD" filter="url(#raShadow)"/>
  <!-- chrome bar -->
  <path d="M120 112 a16 16 0 0 1 16 -16 h1328 a16 16 0 0 1 16 16 v44 h-1360 z" fill="#F4F0E8"/>
  <line x1="120" y1="156" x2="1480" y2="156" stroke="#E2DBCD"/>
  <circle cx="152" cy="134" r="6" fill="#E06C5E"/>
  <circle cx="176" cy="134" r="6" fill="#E6B23C"/>
  <circle cx="200" cy="134" r="6" fill="#5FB07A"/>
  <rect x="248" y="120" width="560" height="28" rx="14" fill="#FFFFFF" stroke="#E2DBCD"/>
  <circle cx="272" cy="134" r="5" fill="none" stroke="#9A9AA2" stroke-width="1.6"/>
  <text x="292" y="139" fill="#6B6B73" font-size="13">localhost:5173</text>

  <!-- ============ mock webpage ============ -->
  <!-- nav -->
  <rect x="152" y="178" width="22" height="22" rx="6" fill="#1D3A5F"/>
  <text x="184" y="195" fill="#1A1A1A" font-size="15" font-weight="700">Acme Store</text>
  <g fill="#6B6B73" font-size="14">
    <text x="360" y="195">Shop</text>
    <text x="430" y="195">Catalog</text>
    <text x="520" y="195">About</text>
  </g>

  <!-- hero heading -->
  <text x="152" y="270" fill="#1A1A1A" font-size="30" font-weight="800">New arrivals</text>
  <rect x="152" y="288" width="380" height="10" rx="5" fill="#ECE5D9"/>

  <!-- product cards row -->
  <!-- card 1 -->
  <rect x="152" y="336" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#E8E1D5"/>
  <rect x="172" y="356" width="240" height="150" rx="10" fill="url(#raImg2)"/>
  <rect x="172" y="524" width="150" height="12" rx="6" fill="#E0D9CC"/>
  <rect x="172" y="548" width="90" height="10" rx="5" fill="#ECE5D9"/>
  <text x="172" y="600" fill="#1A1A1A" font-size="16" font-weight="700">$48</text>
  <rect x="300" y="582" width="112" height="34" rx="8" fill="#F1EDE6" stroke="#E2DBCD"/>
  <text x="356" y="604" text-anchor="middle" fill="#4A4A50" font-size="12" font-weight="600">Add to cart</text>

  <!-- card 2 (SELECTED) -->
  <rect x="460" y="336" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#E8E1D5"/>
  <rect x="480" y="356" width="240" height="150" rx="10" fill="url(#raImg)"/>
  <rect x="480" y="524" width="150" height="12" rx="6" fill="#D4DCE8"/>
  <rect x="480" y="548" width="90" height="10" rx="5" fill="#E6ECF4"/>
  <text x="480" y="600" fill="#1A1A1A" font-size="16" font-weight="700">$64</text>
  <rect x="608" y="582" width="112" height="34" rx="8" fill="#F1EDE6" stroke="#E2DBCD"/>
  <text x="664" y="604" text-anchor="middle" fill="#4A4A50" font-size="12" font-weight="600">Add to cart</text>

  <!-- selection overlay -->
  <rect x="450" y="326" width="300" height="320" rx="16" fill="#1D3A5F" opacity="0.06"/>
  <rect x="450" y="326" width="300" height="320" rx="16" fill="none" stroke="#1D3A5F" stroke-width="2" stroke-dasharray="7 6"/>
  <g fill="#1D3A5F">
    <rect x="444" y="320" width="12" height="12" rx="2"/>
    <rect x="744" y="320" width="12" height="12" rx="2"/>
    <rect x="444" y="640" width="12" height="12" rx="2"/>
    <rect x="744" y="640" width="12" height="12" rx="2"/>
  </g>
  <!-- component label tab -->
  <rect x="450" y="298" width="168" height="26" rx="6" fill="#1D3A5F"/>
  <text x="466" y="316" fill="#FFFFFF" font-size="13" font-weight="600">&lt;ProductCard&gt;</text>
  <text x="588" y="316" fill="#A9C0DC" font-size="12">280×300</text>
  <!-- annotation pin -->
  <circle cx="744" cy="346" r="14" fill="#C2703D"/>
  <text x="744" y="351" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="700">1</text>

  <!-- card 3 (peeking behind panel) -->
  <rect x="768" y="336" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#E8E1D5"/>
  <rect x="788" y="356" width="240" height="150" rx="10" fill="url(#raImg2)"/>
  <rect x="788" y="524" width="150" height="12" rx="6" fill="#E0D9CC"/>

  <!-- ============ extension panel ============ -->
  <rect x="1056" y="150" width="368" height="664" rx="14" fill="#FFFFFF" stroke="#E2DBCD" filter="url(#raShadow)"/>
  <!-- panel header -->
  <rect x="1080" y="174" width="30" height="30" rx="8" fill="#1D3A5F"/>
  <text x="1095" y="194" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">&lt;/&gt;</text>
  <text x="1122" y="186" fill="#1A1A1A" font-size="16" font-weight="700">React Annotator</text>
  <text x="1122" y="205" fill="#7A7A82" font-size="12">Inspecting · localhost:5173</text>
  <text x="1392" y="194" fill="#9A9AA2" font-size="18">✕</text>
  <line x1="1080" y1="224" x2="1400" y2="224" stroke="#EEE7DB"/>

  <!-- component tree -->
  <text x="1080" y="256" fill="#9A9AA2" font-size="12" font-weight="600" letter-spacing="0.05em">COMPONENT TREE</text>
  <g font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="1080" y="290" fill="#4A4A50">App</text>
    <text x="1100" y="318" fill="#4A4A50">└ Layout</text>
    <text x="1120" y="346" fill="#4A4A50">└ ProductGrid</text>
    <rect x="1108" y="358" width="296" height="28" rx="7" fill="#E9EEF5"/>
    <text x="1140" y="378" fill="#1D3A5F" font-weight="700">└ ProductCard</text>
    <text x="1160" y="406" fill="#7A7A82">└ Button</text>
  </g>
  <line x1="1080" y1="430" x2="1400" y2="430" stroke="#EEE7DB"/>

  <!-- annotation -->
  <text x="1080" y="462" fill="#9A9AA2" font-size="12" font-weight="600" letter-spacing="0.05em">ANNOTATION</text>
  <circle cx="1090" cy="486" r="9" fill="#C2703D"/>
  <text x="1090" y="491" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700">1</text>
  <rect x="1080" y="504" width="320" height="96" rx="10" fill="#FBF9F5" stroke="#E2DBCD"/>
  <g fill="#4A4A50" font-size="14">
    <text x="1096" y="532">Make the Add to cart button</text>
    <text x="1096" y="556">primary and ~20% larger.</text>
    <text x="1096" y="580">Tighten the card padding.</text>
  </g>

  <!-- props chips -->
  <rect x="1080" y="616" width="150" height="28" rx="14" fill="#F1EDE6" stroke="#E2DBCD"/>
  <text x="1155" y="635" text-anchor="middle" fill="#4A4A50" font-size="12" font-family="ui-monospace, monospace">variant="secondary"</text>
  <rect x="1240" y="616" width="92" height="28" rx="14" fill="#F1EDE6" stroke="#E2DBCD"/>
  <text x="1286" y="635" text-anchor="middle" fill="#4A4A50" font-size="12" font-family="ui-monospace, monospace">size="md"</text>

  <!-- export button -->
  <rect x="1080" y="666" width="320" height="50" rx="10" fill="#1D3A5F"/>
  <path d="M1118 691 l5 -12 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 z" fill="#FFFFFF" opacity="0.92"/>
  <text x="1262" y="697" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="600">Export to Claude Code</text>
  <rect x="1080" y="730" width="320" height="46" rx="10" fill="#FFFFFF" stroke="#E2DBCD"/>
  <text x="1240" y="759" text-anchor="middle" fill="#4A4A50" font-size="14" font-weight="600">Copy selection JSON</text>
</svg>
