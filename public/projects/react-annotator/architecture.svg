<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="react-annotator-arch-title react-annotator-arch-desc">
<title id="react-annotator-arch-title">React Annotator architecture</title>
<desc id="react-annotator-arch-desc">A page script reads React's fiber tree to find components; the extension stores notes locally and exports Markdown you paste into Claude Code.</desc>
