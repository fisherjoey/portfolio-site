  <circle cx="980" cy="312" r="5" fill="#1D3A5F"/>
  <text x="994" y="317" fill="#6B6B73" font-size="13">This week</text>
  <circle cx="1066" cy="312" r="5" fill="#C2703D"/>
  <text x="1080" y="317" fill="#6B6B73" font-size="13" text-anchor="start">Last</text>

