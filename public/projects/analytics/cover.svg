<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="anArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D3A5F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1D3A5F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- canvas -->
  <rect width="1600" height="1000" fill="#FAF8F4"/>

  <!-- sidebar -->
  <rect x="0" y="0" width="240" height="1000" fill="#FFFFFF"/>
  <line x1="240" y1="0" x2="240" y2="1000" stroke="#E8E1D5"/>
  <rect x="32" y="34" width="22" height="22" rx="6" fill="#1D3A5F"/>
  <rect x="38" y="40" width="10" height="10" rx="2" fill="#FFFFFF"/>
  <text x="66" y="51" fill="#1A1A1A" font-size="17" font-weight="700">Pulse</text>

  <!-- nav -->
  <rect x="16" y="104" width="208" height="40" rx="9" fill="#1D3A5F"/>
  <rect x="32" y="118" width="13" height="13" rx="3" fill="#FFFFFF" opacity="0.9"/>
  <text x="58" y="129" fill="#FFFFFF" font-size="14" font-weight="600">Overview</text>
  <g fill="#6B6B73" font-size="14">
    <rect x="32" y="166" width="13" height="13" rx="3" fill="#C9C2B6"/>
    <text x="58" y="177">Traffic</text>
    <rect x="32" y="214" width="13" height="13" rx="3" fill="#C9C2B6"/>
    <text x="58" y="225">Leads</text>
    <rect x="32" y="262" width="13" height="13" rx="3" fill="#C9C2B6"/>
    <text x="58" y="273">Revenue</text>
    <rect x="32" y="310" width="13" height="13" rx="3" fill="#C9C2B6"/>
    <text x="58" y="321">Reports</text>
  </g>
  <line x1="32" y1="916" x2="208" y2="916" stroke="#EEE7DB"/>
  <rect x="32" y="940" width="13" height="13" rx="3" fill="#C9C2B6"/>
  <text x="58" y="951" fill="#6B6B73" font-size="14">Settings</text>

  <!-- top bar -->
  <rect x="240" y="0" width="1360" height="80" fill="#FFFFFF"/>
  <line x1="240" y1="80" x2="1600" y2="80" stroke="#E8E1D5"/>
  <text x="280" y="40" fill="#1A1A1A" font-size="22" font-weight="700">Overview</text>
  <text x="280" y="62" fill="#7A7A82" font-size="13">This week · Jun 9–15</text>
  <rect x="1300" y="22" width="138" height="36" rx="18" fill="#F4F0E8" stroke="#E2DBCD"/>
  <text x="1320" y="45" fill="#4A4A50" font-size="13">Last 7 days ▾</text>
  <circle cx="1532" cy="40" r="20" fill="#E9EEF5"/>
  <text x="1532" y="46" text-anchor="middle" fill="#1D3A5F" font-size="14" font-weight="700">JF</text>

  <!-- KPI cards -->
  <g>
    <rect x="280" y="112" width="408" height="132" rx="14" fill="#FFFFFF" stroke="#E8E1D5"/>
    <text x="308" y="152" fill="#7A7A82" font-size="14">Visitors</text>
    <text x="308" y="198" fill="#1A1A1A" font-size="36" font-weight="700">12.4k</text>
    <text x="308" y="226" fill="#2E7D5B" font-size="14" font-weight="600">▲ 8.2% vs last week</text>
  </g>
  <g>
    <rect x="716" y="112" width="408" height="132" rx="14" fill="#FFFFFF" stroke="#E8E1D5"/>
    <text x="744" y="152" fill="#7A7A82" font-size="14">New leads</text>
    <text x="744" y="198" fill="#1A1A1A" font-size="36" font-weight="700">48</text>
    <text x="744" y="226" fill="#2E7D5B" font-size="14" font-weight="600">▲ 12% vs last week</text>
  </g>
  <g>
    <rect x="1152" y="112" width="408" height="132" rx="14" fill="#FFFFFF" stroke="#E8E1D5"/>
    <text x="1180" y="152" fill="#7A7A82" font-size="14">Revenue</text>
    <text x="1180" y="198" fill="#1A1A1A" font-size="36" font-weight="700">$9,240</text>
    <text x="1180" y="226" fill="#2E7D5B" font-size="14" font-weight="600">▲ 5.1% vs last week</text>
  </g>

