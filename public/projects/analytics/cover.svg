    <text x="439" y="626">Tue</text>
    <text x="566" y="626">Wed</text>
    <text x="694" y="626">Thu</text>
    <text x="821" y="626">Fri</text>
    <text x="948" y="626">Sat</text>
    <text x="1076" y="626">Sun</text>
  </g>

