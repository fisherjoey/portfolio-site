    <line x1="312" y1="420" x2="1076" y2="420"/>
    <line x1="312" y1="480" x2="1076" y2="480"/>
    <line x1="312" y1="540" x2="1076" y2="540"/>
    <line x1="312" y1="600" x2="1076" y2="600"/>
  </g>
  <!-- last week (comparison) -->
  <path d="M312,548 L439,532 L566,540 L694,512 L821,520 L948,498 L1076,506"
        fill="none" stroke="#C2703D" stroke-width="2" stroke-dasharray="5 6" opacity="0.7"/>
  <!-- this week -->
  <path d="M312,530 L439,500 L566,516 L694,476 L821,490 L948,444 L1076,460 L1076,600 L312,600 Z" fill="url(#anArea)"/>
  <path d="M312,530 L439,500 L566,516 L694,476 L821,490 L948,444 L1076,460"
