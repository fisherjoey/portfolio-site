    <text x="1528" y="368" fill="#7A7A82" text-anchor="end">62%</text>
    <rect x="1164" y="378" width="364" height="12" rx="6" fill="#F1EADD"/>
    <rect x="1164" y="378" width="226" height="12" rx="6" fill="#1D3A5F"/>

    <text x="1164" y="436" fill="#4A4A50">Direct</text>
    <text x="1528" y="436" fill="#7A7A82" text-anchor="end">24%</text>
    <rect x="1164" y="446" width="364" height="12" rx="6" fill="#F1EADD"/>
    <rect x="1164" y="446" width="87" height="12" rx="6" fill="#3E6196"/>

    <text x="1164" y="504" fill="#4A4A50">Referral</text>
    <text x="1528" y="504" fill="#7A7A82" text-anchor="end">9%</text>
    <rect x="1164" y="514" width="364" height="12" rx="6" fill="#F1EADD"/>
    <rect x="1164" y="514" width="33" height="12" rx="6" fill="#6E8CB4"/>

    <text x="1164" y="572" fill="#4A4A50">Social</text>
    <text x="1528" y="572" fill="#7A7A82" text-anchor="end">5%</text>
    <rect x="1164" y="582" width="364" height="12" rx="6" fill="#F1EADD"/>
    <rect x="1164" y="582" width="18" height="12" rx="6" fill="#C2703D"/>
  </g>
  <line x1="1164" y1="614" x2="1528" y2="614" stroke="#F1EADD"/>
  <text x="1164" y="640" fill="#A9A39A" font-size="12">Source: Google Analytics</text>

  <!-- weekly AI summary -->
  <rect x="280" y="688" width="1280" height="224" rx="14" fill="#EFF3F9" stroke="#D6E0EE"/>
  <path d="M324 740 l8 -20 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 z" fill="#1D3A5F"/>
  <text x="372" y="742" fill="#1A1A1A" font-size="18" font-weight="700">Weekly summary</text>
  <rect x="1392" y="724" width="140" height="30" rx="15" fill="#FFFFFF" stroke="#C7D5E8"/>
  <text x="1462" y="744" text-anchor="middle" fill="#1D3A5F" font-size="13" font-weight="600">Generated by Claude</text>
  <g font-size="16" fill="#4A4A50">
    <text x="324" y="800">Traffic is up 8% week-over-week, led by organic search — now 62% of all sessions.</text>
    <text x="324" y="834">48 new leads came in, 12% above last week, and revenue is tracking ahead of the monthly target.</text>
    <text x="324" y="868" fill="#7A7A82">Recommended: keep promoting the two posts driving most of the organic lift.</text>
  </g>
