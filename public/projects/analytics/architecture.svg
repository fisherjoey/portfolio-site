<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="analytics-arch-title analytics-arch-desc">
<title id="analytics-arch-title">Analytics dashboard architecture</title>
<desc id="analytics-arch-desc">Shop staff use a Next.js dashboard that caches CRM data in Supabase, pulls Google and Meta APIs, and has an AI analyst chat that answers from the loaded numbers.</desc>
