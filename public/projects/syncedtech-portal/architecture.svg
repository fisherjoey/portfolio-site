<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="syncedtech-portal-arch-title syncedtech-portal-arch-desc">
<title id="syncedtech-portal-arch-title">SyncedTech Portal architecture</title>
<desc id="syncedtech-portal-arch-desc">Staff and clients use a Next.js app on Vercel; a daily cron drafts and emails invoices; Supabase stores clients, hours and PDFs.</desc>
<defs><marker id="syncedtech-portal-arch-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B6B73"/></marker></defs>
<text x="40" y="78" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40">From logged hours to a sent invoice</text>
<line x1="386" y1="402" x2="424" y2="402" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#syncedtech-portal-arch-arr)"/>
<line x1="776" y1="402" x2="814" y2="402" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#syncedtech-portal-arch-arr)"/>
<rect x="40" y="128" width="340" height="512" rx="10" fill="rgba(26,26,26,0.035)"/>
