<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 760" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f46c14"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2e64e2"/>
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#facc15"/>
    </marker>
  </defs>

  <rect width="1480" height="760" fill="url(#bg)"/>

  <!-- Title band -->
  <text x="60" y="48" fill="#f8fafc" font-size="24" font-weight="700">synced-site → live client site</text>
  <text x="60" y="74" fill="#94a3b8" font-size="13">Code path (top) and content path (bottom) merge at deploy.</text>

  <!-- Lane backgrounds -->
  <rect x="40"  y="110" width="1400" height="190" rx="14" fill="#141823" stroke="#1f2533"/>
  <rect x="40"  y="320" width="1400" height="190" rx="14" fill="#141823" stroke="#1f2533"/>

  <!-- Lane labels -->
  <g>
    <rect x="40" y="110" width="180" height="190" rx="14" fill="#1a1f2c" stroke="#1f2533"/>
    <text x="60" y="146" fill="#f46c14" font-size="13" font-weight="700" letter-spacing="1.5">CODE</text>
    <text x="60" y="172" fill="#cbd5e1" font-size="12">github.com/fisherjoey/</text>
    <text x="60" y="188" fill="#cbd5e1" font-size="12">synced-site</text>
    <text x="60" y="216" fill="#64748b" font-size="11">React 19 · Vite</text>
    <text x="60" y="232" fill="#64748b" font-size="11">Tailwind</text>
    <text x="60" y="256" fill="#64748b" font-size="11">Section + industry</text>
    <text x="60" y="272" fill="#64748b" font-size="11">packs</text>
  </g>
  <g>
    <rect x="40" y="320" width="180" height="190" rx="14" fill="#1a1f2c" stroke="#1f2533"/>
    <text x="60" y="356" fill="#2e64e2" font-size="13" font-weight="700" letter-spacing="1.5">CONTENT</text>
    <text x="60" y="382" fill="#cbd5e1" font-size="12">Sanity Studio</text>
    <text x="60" y="398" fill="#cbd5e1" font-size="12">+ dataset</text>
    <text x="60" y="426" fill="#64748b" font-size="11">Per-client</text>
    <text x="60" y="442" fill="#64748b" font-size="11">projectId</text>
    <text x="60" y="466" fill="#64748b" font-size="11">Hosted at</text>
    <text x="60" y="482" fill="#64748b" font-size="11">*.sanity.studio</text>
  </g>

  <!-- ===== CODE NODES (5) ===== -->
  <!-- 1 -->
  <g transform="translate(248,140)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#f46c14" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#f46c14"/>
    <text x="22" y="28" text-anchor="middle" fill="#0b0d12" font-size="12" font-weight="700">1</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Use template</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">"Use this template"</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">→ client-site repo</text>
    <text x="14" y="100" fill="#64748b" font-size="10">Tag v0.2.0</text>
    <text x="14" y="115" fill="#64748b" font-size="10">core + industry packs</text>
  </g>
  <!-- 2 -->
  <g transform="translate(478,140)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#f46c14" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#f46c14"/>
    <text x="22" y="28" text-anchor="middle" fill="#0b0d12" font-size="12" font-weight="700">2</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Fill brief</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">scope · brand · pages</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">domain · host</text>
    <text x="14" y="100" fill="#64748b" font-size="10">e.g.</text>
    <text x="14" y="115" fill="#64748b" font-size="10">synced-tech-brief.md</text>
  </g>
  <!-- 3 -->
  <g transform="translate(708,140)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#f46c14" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#f46c14"/>
    <text x="22" y="28" text-anchor="middle" fill="#0b0d12" font-size="12" font-weight="700">3</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Brand config</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">palette · fonts · logo</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">tailwind tokens</text>
    <text x="14" y="100" fill="#64748b" font-size="10">tailwind.config</text>
    <text x="14" y="115" fill="#64748b" font-size="10">+ brand.css</text>
  </g>
  <!-- 4 -->
  <g transform="translate(938,140)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#f46c14" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#f46c14"/>
    <text x="22" y="28" text-anchor="middle" fill="#0b0d12" font-size="12" font-weight="700">4</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Industry pack</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">automotive / IT</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">opt-in only</text>
    <text x="14" y="100" fill="#64748b" font-size="10">industries/&lt;name&gt;/</text>
    <text x="14" y="115" fill="#64748b" font-size="10">section components</text>
  </g>
  <!-- 5 -->
  <g transform="translate(1168,140)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#f46c14" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#f46c14"/>
    <text x="22" y="28" text-anchor="middle" fill="#0b0d12" font-size="12" font-weight="700">5</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Wire env</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">VITE_SANITY_</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">PROJECT_ID + DATASET</text>
    <text x="14" y="100" fill="#64748b" font-size="10">.env.local in dev,</text>
    <text x="14" y="115" fill="#64748b" font-size="10">host vars in prod</text>
  </g>

  <!-- ===== CONTENT NODES (4) ===== -->
  <!-- A -->
  <g transform="translate(248,350)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#2e64e2" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#2e64e2"/>
    <text x="22" y="28" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">A</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Sanity project</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">sanity init →</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">new projectId</text>
    <text x="14" y="100" fill="#64748b" font-size="10">dataset: production</text>
    <text x="14" y="115" fill="#64748b" font-size="10">CORS: site origins</text>
  </g>
  <!-- B -->
  <g transform="translate(478,350)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#2e64e2" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#2e64e2"/>
    <text x="22" y="28" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">B</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Schema</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">page · portfolio · blog</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">+ section objects</text>
    <text x="14" y="100" fill="#64748b" font-size="10">studio/schemaTypes/</text>
    <text x="14" y="115" fill="#64748b" font-size="10">documents | objects</text>
  </g>
  <!-- C -->
  <g transform="translate(708,350)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#2e64e2" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#2e64e2"/>
    <text x="22" y="28" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">C</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Seed content</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">pages · portfolio</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">images · settings</text>
    <text x="14" y="100" fill="#64748b" font-size="10">scripts/seed-*.cjs</text>
    <text x="14" y="115" fill="#64748b" font-size="10">or hand-edit in studio</text>
  </g>
  <!-- D -->
  <g transform="translate(938,350)">
    <rect width="200" height="130" rx="10" fill="#1c2331" stroke="#2e64e2" stroke-width="1.5"/>
    <circle cx="22" cy="24" r="13" fill="#2e64e2"/>
    <text x="22" y="28" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="700">D</text>
    <text x="44" y="29" fill="#f8fafc" font-size="13" font-weight="600">Deploy studio</text>
    <text x="14" y="60" fill="#cbd5e1" font-size="11">sanity deploy →</text>
    <text x="14" y="76" fill="#cbd5e1" font-size="11">&lt;name&gt;.sanity.studio</text>
    <text x="14" y="100" fill="#64748b" font-size="10">commit schemaTypes/</text>
    <text x="14" y="115" fill="#64748b" font-size="10">to client repo too</text>
  </g>

  <!-- ===== DEPLOY ===== -->
  <g transform="translate(1168,335)">
    <rect width="200" height="160" rx="12" fill="#0f1622" stroke="#facc15" stroke-width="2"/>
    <text x="100" y="32" text-anchor="middle" fill="#facc15" font-size="13" font-weight="700" letter-spacing="1.5">DEPLOY</text>
    <text x="100" y="58" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Vercel / Netlify</text>
    <text x="100" y="76" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">/ Cloudflare</text>
    <line x1="20" y1="92" x2="180" y2="92" stroke="#1f2533"/>
    <text x="100" y="112" text-anchor="middle" fill="#cbd5e1" font-size="11">git push → preview</text>
    <text x="100" y="128" text-anchor="middle" fill="#cbd5e1" font-size="11">merge → production</text>
    <text x="100" y="148" text-anchor="middle" fill="#64748b" font-size="10">env vars set in host</text>
  </g>

  <!-- ===== LIVE ===== -->
  <g transform="translate(1168,540)">
    <rect width="200" height="60" rx="12" fill="#10b981" opacity="0.12" stroke="#10b981" stroke-width="2"/>
    <circle cx="32" cy="30" r="9" fill="#10b981"/>
    <text x="100" y="28" text-anchor="middle" fill="#10b981" font-size="13" font-weight="700">LIVE CLIENT SITE</text>
    <text x="100" y="46" text-anchor="middle" fill="#cbd5e1" font-size="11">e.g. okotokstinting.ca</text>
  </g>

  <!-- ===== ARROWS — code lane ===== -->
  <line x1="448" y1="205" x2="478" y2="205" stroke="#f46c14" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="678" y1="205" x2="708" y2="205" stroke="#f46c14" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="908" y1="205" x2="938" y2="205" stroke="#f46c14" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <line x1="1138" y1="205" x2="1168" y2="205" stroke="#f46c14" stroke-width="2" marker-end="url(#arrowOrange)"/>

  <!-- ===== ARROWS — content lane ===== -->
  <line x1="448" y1="415" x2="478" y2="415" stroke="#2e64e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="678" y1="415" x2="708" y2="415" stroke="#2e64e2" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="908" y1="415" x2="938" y2="415" stroke="#2e64e2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Code lane → Deploy (down + right) ===== -->
  <path d="M1268 270 L1268 335" fill="none" stroke="#f46c14" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <!-- ===== Content lane → Deploy (up) ===== -->
  <path d="M1138 415 L1158 415 L1158 415 L1168 415" fill="none" stroke="#2e64e2" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ===== Deploy → Live ===== -->
  <line x1="1268" y1="495" x2="1268" y2="540" stroke="#facc15" stroke-width="2" marker-end="url(#arrowYellow)"/>

  <!-- ===== Legend (replaces dashed arcs) ===== -->
  <g transform="translate(60,620)">
    <text x="0" y="0" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.5">FEEDBACK</text>

    <g transform="translate(0,22)">
      <rect width="14" height="14" fill="#2e64e2" rx="3"/>
      <text x="24" y="11" fill="#cbd5e1" font-size="12">Content edits in Studio publish instantly — no rebuild required.</text>
    </g>

    <g transform="translate(0,46)">
      <rect width="14" height="14" fill="#f46c14" rx="3"/>
      <text x="24" y="11" fill="#cbd5e1" font-size="12">Code or design changes flow PR → preview → merge → redeploy.</text>
    </g>

    <g transform="translate(0,70)">
      <rect width="14" height="14" fill="#facc15" rx="3"/>
      <text x="24" y="11" fill="#cbd5e1" font-size="12">Deploy is the merge point: both paths converge to one live site.</text>
    </g>
  </g>

  <text x="60" y="730" fill="#475569" font-size="10">Per-client: new GitHub repo (template), new Sanity projectId, new host project. Template stays the source of truth for shared sections.</text>
</svg>
