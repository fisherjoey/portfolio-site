<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="syncedbase-title syncedbase-desc">
<title id="syncedbase-title">How SyncedBase turns into a client site</title>
<desc id="syncedbase-desc">Four-step flow: fork the SyncedBase template, pick a palette and theme, stack ready-made sections, and launch a client site the client edits in Sanity, in days instead of weeks.</desc>
<defs>
<marker id="syncedbase-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B6B73"/></marker>
<marker id="syncedbase-arr-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1D3A5F"/></marker>
</defs>
<text x="48" y="92" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="44">One template, a new client site in days</text>
<line x1="294" y1="350" x2="330" y2="350" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#syncedbase-arr)"/>
<line x1="582" y1="350" x2="618" y2="350" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#syncedbase-arr)"/>
<line x1="870" y1="350" x2="906" y2="350" stroke="#1D3A5F" stroke-width="3" marker-end="url(#syncedbase-arr-a)"/>
<rect x="48" y="180" width="240" height="340" rx="8" fill="#FFFFFF" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="72" y="228" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">01</text>
<text x="72" y="284" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Fork the</text>
<text x="72" y="324" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">template</text>
<text x="72" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">One React + Vite</text>
<text x="72" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">base, reused for</text>
<text x="72" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">every client</text>
<rect x="336" y="180" width="240" height="340" rx="8" fill="#FFFFFF" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="360" y="228" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">02</text>
<text x="360" y="284" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Pick a look</text>
<text x="360" y="338" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">About 15 colour</text>
<text x="360" y="369" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">palettes and</text>
<text x="360" y="400" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">6 themes</text>
<rect x="624" y="180" width="240" height="340" rx="8" fill="#FFFFFF" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="648" y="228" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">03</text>
<text x="648" y="284" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Stack the</text>
<text x="648" y="324" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">sections</text>
<text x="648" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">Hero, pricing,</text>
<text x="648" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">testimonials,</text>
<text x="648" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">gallery, contact</text>
<rect x="912" y="180" width="240" height="340" rx="8" fill="#E4E9F0" stroke="#1D3A5F" stroke-width="2.5"/>
<text x="936" y="228" fill="#1D3A5F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">04</text>
<text x="936" y="284" fill="#1D3A5F" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Client site</text>
<text x="936" y="324" fill="#1D3A5F" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">goes live</text>
<text x="936" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">The client edits</text>
<text x="936" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">their own content</text>
<text x="936" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">in Sanity CMS</text>
<line x1="48" y1="576" x2="1152" y2="576" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="48" y="624" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-style="italic" font-size="30">OK Tint's site runs on it.</text>
</svg>
