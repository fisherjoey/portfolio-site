<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="syncedsport-arch-title syncedsport-arch-desc">
<title id="syncedsport-arch-title">SyncedSport architecture</title>
<desc id="syncedsport-arch-desc">League staff and referees use a Next.js app on an Express API; an optimization solver assigns referees; Postgres, Redis and outside services sit underneath; an AI assistant can read data through a read-only MCP connector.</desc>
