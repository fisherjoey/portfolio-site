<title id="arsenic-cys-finder-arch-title">Arsenic Drug-Target Finder architecture</title>
<desc id="arsenic-cys-finder-arch-desc">A Python pipeline reads AlphaFold and PDB structures plus cancer and drug data, screens for three-cysteine geometry, optionally re-folds mutants with ESMFold, and writes ranked results and ChimeraX scripts.</desc>
