<title id="prospector-arch-title">Prospector architecture</title>
<desc id="prospector-arch-desc">Businesses from Google Places are scraped for facts, an LLM writes site copy from those facts only, claim checks strip anything unsupported, and the static mockup deploys to Vercel before a CASL-compliant email goes out.</desc>
