<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="cboa-arch-title cboa-arch-desc">
<title id="cboa-arch-title">CBOA Member Portal architecture</title>
<desc id="cboa-arch-desc">A static Next.js site on Netlify with serverless functions; Supabase holds the database, auth and CMS content, and Microsoft 365 sends email and syncs forms to Excel.</desc>
<defs><marker id="cboa-arch-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B6B73"/></marker></defs>
<text x="40" y="78" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40">Static site with a live members-only portal</text>
