<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="cmba-clinic-arch-title cmba-clinic-arch-desc">
<title id="cmba-clinic-arch-title">CMBA Referee Clinic architecture</title>
<desc id="cmba-clinic-arch-desc">Referees and coordinators pass an edge access gate to static course pages and a rules lookup API; Supabase stores progress, and Claude Haiku can write cited answers from retrieved rule passages.</desc>
