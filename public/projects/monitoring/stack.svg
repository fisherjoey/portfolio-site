<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="monitoring-title monitoring-desc">
<title id="monitoring-title">How the monitoring platform works</title>
<desc id="monitoring-desc">Four-step flow: customer servers and sites are measured, metrics are collected with Prometheus and custom exporters, a custom webapp turns them into per-customer dashboards and alerts, and the on-call engineer gets paged.</desc>
<defs>
<marker id="monitoring-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B6B73"/></marker>
<marker id="monitoring-arr-a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#1D3A5F"/></marker>
</defs>
<text x="48" y="92" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="44">From a failing server to the right person's phone</text>
<line x1="294" y1="350" x2="330" y2="350" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#monitoring-arr)"/>
<line x1="582" y1="350" x2="618" y2="350" stroke="#1D3A5F" stroke-width="3" marker-end="url(#monitoring-arr-a)"/>
<line x1="870" y1="350" x2="906" y2="350" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#monitoring-arr)"/>
<rect x="48" y="180" width="240" height="340" rx="8" fill="#FFFFFF" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="72" y="228" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">01</text>
<text x="72" y="284" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Customer</text>
<text x="72" y="324" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">systems</text>
<text x="72" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">Servers, websites,</text>
<text x="72" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">SSL certificates,</text>
<text x="72" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">internal services</text>
<rect x="336" y="180" width="240" height="340" rx="8" fill="#FFFFFF" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="360" y="228" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">02</text>
<text x="360" y="284" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Metrics</text>
<text x="360" y="324" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">collected</text>
<text x="360" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">Prometheus, plus</text>
<text x="360" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">custom exporters</text>
<text x="360" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">for the gaps</text>
<rect x="624" y="180" width="240" height="340" rx="8" fill="#E4E9F0" stroke="#1D3A5F" stroke-width="2.5"/>
<text x="648" y="228" fill="#1D3A5F" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">03</text>
<text x="648" y="284" fill="#1D3A5F" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">The webapp</text>
<text x="648" y="324" fill="#1D3A5F" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">I built</text>
<text x="648" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">Dashboards per</text>
<text x="648" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">customer, access</text>
<text x="648" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">control, incidents</text>
<rect x="912" y="180" width="240" height="340" rx="8" fill="#FFFFFF" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="936" y="228" fill="#A08758" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="2">04</text>
<text x="936" y="284" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">Engineer</text>
<text x="936" y="324" fill="#1A1A1A" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="31" font-weight="700">paged</text>
<text x="936" y="378" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">Alerts follow the</text>
<text x="936" y="409" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">on-call rotation,</text>
<text x="936" y="440" fill="#4A4A50" font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21">not the whole team</text>
<line x1="48" y1="576" x2="1152" y2="576" stroke="rgba(26,26,26,0.18)" stroke-width="1.5"/>
<text x="48" y="624" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-style="italic" font-size="30">Rolled out to 10+ customer organizations.</text>
</svg>
