<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="tt-save-editor-arch-title tt-save-editor-arch-desc">
<title id="tt-save-editor-arch-title">TT Save Editor architecture</title>
<desc id="tt-save-editor-arch-desc">A save file is decrypted, parsed and edited entirely in the browser, then re-encrypted and downloaded with a backup copy.</desc>
<defs><marker id="tt-save-editor-arch-arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B6B73"/></marker></defs>
<text x="40" y="78" fill="#1A1A1A" font-family="Fraunces, Georgia, 'Times New Roman', serif" font-size="40">Edits game saves without uploading them</text>
<line x1="386" y1="402" x2="424" y2="402" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#tt-save-editor-arch-arr)"/>
<line x1="776" y1="402" x2="814" y2="402" stroke="#6B6B73" stroke-width="2.5" marker-end="url(#tt-save-editor-arch-arr)"/>
<rect x="40" y="128" width="340" height="512" rx="10" fill="rgba(26,26,26,0.035)"/>
